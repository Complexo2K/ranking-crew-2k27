<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complexo 2K - Timing Trainer</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.trainer {
  width: 92%;
  max-width: 700px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin: 0 0 8px;
}

.status {
  color: #aaa;
  margin-bottom: 20px;
  font-size: 14px;
}

/* =========================
   BARRA
========================= */

.timing-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 15px;
}

.timing-title {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 12px;
  letter-spacing: 2px;
}

.vertical-wrapper {
  position: relative;
  width: 190px;
  height: 360px;
  display: flex;
  justify-content: center;
}

.timing-bar {
  position: relative;
  width: 48px;
  height: 360px;
  background: #292929;
  border: 2px solid #555;
  border-radius: 10px;
  overflow: hidden;
}

/* preenchimento que sobe */

.live-fill {
  position: absolute;
  bottom: 0;
  left: 0;

  width: 100%;
  height: 0%;

  background: rgba(255,255,255,0.18);
}

/* GREEN 605–640 */

.green-window {
  position: absolute;
  top: 44%;
  height: 14%;
  left: 0;
  width: 100%;

  background: #00d965;

  box-shadow:
    0 0 14px rgba(0,255,115,0.6);

  z-index: 2;
}

/* MARCADOR */

.marker {
  position: absolute;

  left: -18px;

  width: 80px;
  height: 4px;

  background: white;

  box-shadow:
    0 0 10px white;

  display: none;

  transform: translateY(-50%);

  z-index: 10;
}

.marker::after {
  content: "";

  position: absolute;

  right: -9px;
  top: 50%;

  transform: translateY(-50%);

  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-left: 9px solid white;
}

/* números */

.scale-label {
  position: absolute;
  left: 130px;
  font-size: 13px;
  transform: translateY(-50%);
}

.label-750 {
  top: 0%;
  color: #777;
}

.label-640 {
  top: 44%;
  color: #00ff73;
}

.label-605 {
  top: 58%;
  color: #00ff73;
}

.label-500 {
  top: 100%;
  color: #777;
}

/* textos laterais */

.late-label {
  position: absolute;
  right: 125px;
  top: 15%;
  color: #ff3535;
  font-size: 12px;
  font-weight: bold;
}

.green-label {
  position: absolute;
  right: 120px;
  top: 51%;
  transform: translateY(-50%);
  color: #00ff73;
  font-size: 12px;
  font-weight: bold;
}

.early-label {
  position: absolute;
  right: 125px;
  top: 80%;
  color: #ffae00;
  font-size: 12px;
  font-weight: bold;
}

/* =========================
   TIMER
========================= */

.timer-container {
  margin-top: 25px;
}

.timer {
  font-size: 72px;
  font-weight: 900;
}

.ms {
  font-size: 22px;
  color: #999;
}

/* =========================
   X
========================= */

.button-x {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  margin: 20px auto;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #1266d3;

  font-size: 48px;
  font-weight: bold;

  transition: 0.05s;
}

.button-x.pressed {
  transform: scale(0.85);
  box-shadow: 0 0 25px #1266d3;
}

/* =========================
   RESULTADO
========================= */

.result {
  font-size: 38px;
  font-weight: 900;
  margin-top: 15px;
  min-height: 48px;
}

.early { color: #ffae00; }
.green { color: #00ff73; }
.late  { color: #ff3535; }

.release-info {
  margin-top: 8px;
  font-size: 17px;
  color: #aaa;
  min-height: 24px;
}

.window-info {
  margin-top: 12px;
  color: #777;
  font-size: 14px;
}

</style>
</head>

<body>

<div class="trainer">

<h1>JUMPSHOT TIMING TRAINER</h1>

<div id="status" class="status">
Conecte o controle e pressione qualquer botão
</div>


<!-- BARRA -->

<div class="timing-area">

<div class="timing-title">
RELEASE TIMING
</div>

<div class="vertical-wrapper">

<div class="late-label">LATE</div>
<div class="green-label">GREEN</div>
<div class="early-label">EARLY</div>

<div class="timing-bar">

<div
id="liveFill"
class="live-fill">
</div>

<div class="green-window"></div>

</div>

<div
id="marker"
class="marker">
</div>

<div class="scale-label label-750">
750 ms
</div>

<div class="scale-label label-640">
640
</div>

<div class="scale-label label-605">
605
</div>

<div class="scale-label label-500">
500 ms
</div>

</div>
</div>


<!-- TIMER -->

<div class="timer-container">

<span id="timer" class="timer">
0
</span>

<span class="ms">
ms
</span>

</div>


<!-- BOTÃO -->

<div id="buttonX" class="button-x">
X
</div>


<!-- RESULTADO -->

<div id="result" class="result">
SEGURE X E SOLTE
</div>

<div
id="releaseInfo"
class="release-info">
</div>

<div class="window-info">
GREEN WINDOW: 605–640 ms
</div>

</div>


<script>

/* ============================
   CONFIGURAÇÕES
============================ */

const GREEN_START = 605;
const GREEN_END = 640;

const BAR_MIN = 500;
const BAR_MAX = 750;


/* ============================
   VARIÁVEIS
============================ */

let pressing = false;
let startTime = 0;


/* ============================
   ELEMENTOS
============================ */

const timer =
document.getElementById("timer");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const buttonX =
document.getElementById("buttonX");

const marker =
document.getElementById("marker");

const liveFill =
document.getElementById("liveFill");

const releaseInfo =
document.getElementById("releaseInfo");


/* ============================
   POSIÇÃO DO MARCADOR
============================ */

function getPosition(ms) {

let percentage =
100 -
(
(ms - BAR_MIN) /
(BAR_MAX - BAR_MIN)
) * 100;

if (percentage < 0)
percentage = 0;

if (percentage > 100)
percentage = 100;

return percentage;

}


/* ============================
   MOVIMENTAR MARCADOR
============================ */

function moveMarker(ms) {

const position =
getPosition(ms);

marker.style.top =
position + "%";

marker.style.display =
"block";

}


/* ============================
   PREENCHER BARRA
============================ */

function updateFill(ms) {

/*
500ms = começo visível
750ms = barra completa
*/

let fill =
((ms - BAR_MIN) /
(BAR_MAX - BAR_MIN)) * 100;

if (fill < 0)
fill = 0;

if (fill > 100)
fill = 100;

liveFill.style.height =
fill + "%";

}


/* ============================
   LOOP
============================ */

function update() {

const gamepads =
navigator.getGamepads();

if (gamepads[0]) {

const controller =
gamepads[0];

status.innerText =
"Controle conectado: " +
controller.id;


/*
Xbox:

A = 0
B = 1
X = 2
Y = 3
*/

const xPressed =
controller.buttons[2].pressed;


/* ============================
   APERTOU
============================ */

if (xPressed && !pressing) {

pressing = true;

startTime =
performance.now();

buttonX.classList.add(
"pressed"
);

result.className =
"result";

result.innerText =
"SEGURANDO...";

releaseInfo.innerText =
"";

marker.style.display =
"block";

liveFill.style.height =
"0%";

}


/* ============================
   SEGURANDO
============================ */

if (xPressed && pressing) {

const current =
performance.now() -
startTime;

const ms =
Math.round(current);

timer.innerText =
ms;


/*
Agora a barra reage
AO VIVO
*/

moveMarker(ms);

updateFill(ms);

}


/* ============================
   SOLTOU
============================ */

if (!xPressed && pressing) {

pressing = false;

const duration =
performance.now() -
startTime;

const ms =
Math.round(duration);

timer.innerText =
ms;


/*
Congela marcador
na posição final
*/

moveMarker(ms);

updateFill(ms);


/* EARLY */

if (ms < GREEN_START) {

result.className =
"result early";

result.innerText =
"EARLY";

const difference =
GREEN_START - ms;

releaseInfo.innerText =
difference +
" ms antes da janela";

}


/* GREEN */

else if (ms <= GREEN_END) {

result.className =
"result green";

result.innerText =
"GREEN!";

const center =
(GREEN_START + GREEN_END) / 2;

const difference =
Math.round(
Math.abs(ms - center)
);

releaseInfo.innerText =
"Dentro da janela • " +
difference +
" ms do centro";

}


/* LATE */

else {

result.className =
"result late";

result.innerText =
"LATE";

const difference =
ms - GREEN_END;

releaseInfo.innerText =
difference +
" ms depois da janela";

}


buttonX.classList.remove(
"pressed"
);

}

}

requestAnimationFrame(update);

}


/* ============================
   INICIAR
============================ */

update();

</script>

</body>
</html>
