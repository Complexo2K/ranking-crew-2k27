<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complexo 2K - Timing Trainer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;
}

.trainer {
  width: 92%;
  max-width: 700px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.status {
  color: #aaa;
  margin-bottom: 25px;
}

/* =========================
   TIMER
========================= */

.timer-container {
  margin: 15px 0;
}

.timer {
  font-size: 72px;
  font-weight: 900;
}

.ms {
  font-size: 22px;
  color: #999;
}

/* =========================
   BOTÃO X
========================= */

.button-x {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  margin: 20px auto;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #1266d3;

  font-size: 48px;
  font-weight: bold;

  transition: transform 0.05s;
}

.button-x.pressed {
  transform: scale(0.85);
}

/* =========================
   RESULTADO
========================= */

.result {
  font-size: 34px;
  font-weight: bold;
  margin-top: 15px;
  min-height: 42px;
}

.early {
  color: #ffae00;
}

.green {
  color: #00ff73;
}

.late {
  color: #ff3535;
}

/* =========================
   ÁREA DA BARRA
========================= */

.timing-area {
  margin-top: 30px;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.timing-title {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 15px;
  letter-spacing: 2px;
}

/* Container para barra + números */

.vertical-wrapper {
  position: relative;

  width: 180px;
  height: 400px;

  display: flex;
  justify-content: center;
}

/* =========================
   BARRA VERTICAL
========================= */

.timing-bar {
  position: relative;

  width: 48px;
  height: 400px;

  background: #292929;

  border: 2px solid #555;
  border-radius: 10px;

  overflow: visible;
}

/*

ESCALA:

TOP
750ms

640ms
GREEN
605ms

500ms
BOTTOM

A barra representa 500 até 750ms.

Green:
605 até 640ms.

*/

/* =========================
   GREEN WINDOW
========================= */

.green-window {
  position: absolute;

  /*
  640ms corresponde a 44%
  vindo do topo.

  605ms corresponde a 58%
  vindo do topo.

  Portanto:
  top = 44%
  height = 14%
  */

  top: 44%;
  height: 14%;

  left: 0;
  width: 100%;

  background: #00d965;

  box-shadow:
    0 0 12px rgba(0,255,115,0.5);
}

/* =========================
   MARCADOR
========================= */

.marker {
  position: absolute;

  left: -18px;

  width: 80px;
  height: 4px;

  background: white;

  box-shadow:
    0 0 10px white;

  display: none;

  transform: translateY(-50%);

  z-index: 10;
}

/* Triângulo do marcador */

.marker::after {

  content: "";

  position: absolute;

  right: -9px;
  top: 50%;

  transform: translateY(-50%);

  width: 0;
  height: 0;

  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;

  border-left: 9px solid white;
}

/* =========================
   ESCALA / NÚMEROS
========================= */

.scale-label {
  position: absolute;

  left: 125px;

  font-size: 13px;

  transform: translateY(-50%);
}

/* 750ms */

.label-750 {
  top: 0%;
  color: #777;
}

/* 640ms */

.label-640 {
  top: 44%;
  color: #00ff73;
}

/* 605ms */

.label-605 {
  top: 58%;
  color: #00ff73;
}

/* 500ms */

.label-500 {
  top: 100%;
  color: #777;
}

/* EARLY / LATE */

.late-label {
  position: absolute;

  right: 120px;
  top: 15%;

  color: #ff3535;

  font-size: 12px;
  font-weight: bold;
}

.early-label {
  position: absolute;

  right: 120px;
  top: 80%;

  color: #ffae00;

  font-size: 12px;
  font-weight: bold;
}

.green-label {
  position: absolute;

  right: 115px;
  top: 51%;

  transform: translateY(-50%);

  color: #00ff73;

  font-size: 12px;
  font-weight: bold;
}

/* =========================
   INFO
========================= */

.release-info {
  margin-top: 20px;

  font-size: 18px;

  color: #aaa;

  min-height: 25px;
}

.window-info {
  margin-top: 8px;

  color: #777;

  font-size: 14px;
}

</style>
</head>


<body>

<div class="trainer">

  <h1>
    JUMPSHOT TIMING TRAINER
  </h1>

  <div id="status" class="status">
    Conecte o controle e pressione qualquer botão
  </div>


  <!-- TIMER -->

  <div class="timer-container">

    <span id="timer" class="timer">
      0
    </span>

    <span class="ms">
      ms
    </span>

  </div>


  <!-- BOTÃO X -->

  <div id="buttonX" class="button-x">
    X
  </div>


  <!-- RESULTADO -->

  <div id="result" class="result">

    Segure X e solte para medir

  </div>


  <!-- =========================
       BARRA VERTICAL
  ========================== -->

  <div class="timing-area">

    <div class="timing-title">
      RELEASE TIMING
    </div>


    <div class="vertical-wrapper">


      <div class="late-label">
        LATE
      </div>


      <div class="green-label">
        GREEN
      </div>


      <div class="early-label">
        EARLY
      </div>


      <div class="timing-bar">

        <!-- GREEN WINDOW -->

        <div class="green-window">
        </div>


        <!-- MARCADOR -->

        <div
          id="marker"
          class="marker">
        </div>

      </div>


      <!-- ESCALA -->

      <div class="scale-label label-750">
        750 ms
      </div>

      <div class="scale-label label-640">
        640
      </div>

      <div class="scale-label label-605">
        605
      </div>

      <div class="scale-label label-500">
        500 ms
      </div>


    </div>

  </div>


  <!-- INFORMAÇÃO DO RELEASE -->

  <div
    id="releaseInfo"
    class="release-info">
  </div>


  <div class="window-info">

    GREEN WINDOW: 605–640 ms

  </div>


</div>


<script>

/* =========================================
   CONFIGURAÇÃO DA JANELA
========================================= */

const GREEN_START = 605;

const GREEN_END = 640;


/* =========================================
   ESCALA DA BARRA
========================================= */

const BAR_MIN = 500;

const BAR_MAX = 750;


/* =========================================
   VARIÁVEIS
========================================= */

let pressing = false;

let startTime = 0;


/* =========================================
   ELEMENTOS
========================================= */

const timer =
  document.getElementById("timer");

const result =
  document.getElementById("result");

const status =
  document.getElementById("status");

const buttonX =
  document.getElementById("buttonX");

const marker =
  document.getElementById("marker");

const releaseInfo =
  document.getElementById("releaseInfo");


/* =========================================
   POSICIONAR MARCADOR
========================================= */

function moveMarker(ms) {

  /*
  Quanto MAIOR o tempo,
  mais ALTO fica o marcador.

  500ms = 100% (embaixo)
  750ms = 0%   (em cima)
  */

  let percentage =
    100 -
    (
      (ms - BAR_MIN) /
      (BAR_MAX - BAR_MIN)
    ) * 100;


  /* Não deixa o marcador
     sair da barra */

  if (percentage < 0) {

    percentage = 0;

  }


  if (percentage > 100) {

    percentage = 100;

  }


  marker.style.top =
    percentage + "%";


  marker.style.display =
    "block";

}


/* =========================================
   LOOP PRINCIPAL
========================================= */

function update() {


  const gamepads =
    navigator.getGamepads();


  if (gamepads[0]) {


    const controller =
      gamepads[0];


    status.innerText =
      "Controle conectado: " +
      controller.id;


    /*
    GAMEPAD API - XBOX

    A = 0
    B = 1
    X = 2
    Y = 3
    */


    const xPressed =
      controller.buttons[2].pressed;



    /* =====================================
       APERTOU X
    ===================================== */

    if (
      xPressed &&
      !pressing
    ) {


      pressing = true;


      startTime =
        performance.now();


      buttonX.classList.add(
        "pressed"
      );


      result.className =
        "result";


      result.innerText =
        "SEGURANDO...";

    }



    /* =====================================
       ENQUANTO SEGURA X
    ===================================== */

    if (
      xPressed &&
      pressing
    ) {


      const current =
        performance.now() -
        startTime;


      timer.innerText =
        Math.round(current);

    }



    /* =====================================
       SOLTOU X
    ===================================== */

    if (
      !xPressed &&
      pressing
    ) {


      pressing = false;


      const duration =
        performance.now() -
        startTime;


      const ms =
        Math.round(duration);


      timer.innerText =
        ms;


      /* COLOCA MARCADOR NA BARRA */

      moveMarker(ms);



      /* =================================
         EARLY
      ================================= */

      if (
        ms < GREEN_START
      ) {


        result.className =
          "result early";


        result.innerText =
          "EARLY";


        const difference =
          GREEN_START - ms;


        releaseInfo.innerText =
          difference +
          " ms antes da janela";

      }



      /* =================================
         GREEN
      ================================= */

      else if (
        ms <= GREEN_END
      ) {


        result.className =
          "result green";


        result.innerText =
          "GREEN!";


        const center =
          (
            GREEN_START +
            GREEN_END
          ) / 2;


        const difference =
          Math.round(
            Math.abs(
              ms - center
            )
          );


        releaseInfo.innerText =
          "Dentro da janela • " +
          difference +
          " ms do centro";

      }



      /* =================================
         LATE
      ================================= */

      else {


        result.className =
          "result late";


        result.innerText =
          "LATE";


        const difference =
          ms - GREEN_END;


        releaseInfo.innerText =
          difference +
          " ms depois da janela";

      }


      buttonX.classList.remove(
        "pressed"
      );

    }

  }


  requestAnimationFrame(
    update
  );

}


/* =========================================
   INICIAR TRAINER
========================================= */

update();

</script>

</body>
</html>
