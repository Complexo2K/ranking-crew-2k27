<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complexo 2K - Timing Trainer</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;

  user-select: none;
  -webkit-user-select: none;
}

.trainer {
  width: 92%;
  max-width: 700px;
  text-align: center;
  padding: 20px 0 30px;
}

h1 {
  font-size: 30px;
  margin: 0 0 8px;
}

.status {
  color: #aaa;
  margin-bottom: 18px;
  font-size: 14px;
}


/* ========================================
   CONFIGURAÇÃO
======================================== */

.window-settings {
  width: 100%;
  max-width: 430px;

  margin: 0 auto 25px;
  padding: 15px;

  background: #111;

  border: 1px solid #333;
  border-radius: 12px;
}

.settings-title {
  font-size: 13px;
  color: #aaa;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.settings-fields {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.field {
  flex: 1;
  text-align: left;
}

.field label {
  display: block;
  font-size: 12px;
  color: #888;
  margin-bottom: 5px;
}

.field input {
  width: 100%;
  padding: 10px;

  background: #080808;

  border: 1px solid #444;
  border-radius: 7px;

  color: white;

  font-size: 18px;
  font-weight: bold;

  text-align: center;

  outline: none;
}

.field input:focus {
  border-color: #00ff73;
}


/* ========================================
   BOTÕES
======================================== */

.apply-button,
.hide-button {

  width: 100%;

  margin-top: 12px;

  padding: 11px;

  border: none;
  border-radius: 7px;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;
}

.apply-button {
  background: #00c85a;
  color: #001b0c;
}

.hide-button {
  background: #252525;
  color: white;
  border: 1px solid #444;
}

.hide-button.active {
  background: #8b1515;
  border-color: #ff3535;
}

.apply-button:active,
.hide-button:active {
  transform: scale(0.98);
}

.settings-message {
  margin-top: 8px;
  min-height: 18px;
  color: #888;
  font-size: 12px;
}


/* ========================================
   BARRA
======================================== */

.timing-area {

  display: flex;
  flex-direction: column;
  align-items: center;

  margin-top: 10px;

  transition:
    opacity 0.2s,
    max-height 0.3s;
}


/*
Quando o modo memória estiver ativo,
a área da barra desaparece.
*/

.timing-area.hidden {

  display: none;

}


.timing-title {

  font-size: 14px;

  color: #aaa;

  margin-bottom: 12px;

  letter-spacing: 2px;

}

.vertical-wrapper {

  position: relative;

  width: 210px;
  height: 340px;

  display: flex;
  justify-content: center;

}

.timing-bar {

  position: relative;

  width: 48px;
  height: 340px;

  background: #292929;

  border: 2px solid #555;
  border-radius: 10px;

  overflow: hidden;

}


/* preenchimento */

.live-fill {

  position: absolute;

  bottom: 0;
  left: 0;

  width: 100%;
  height: 0%;

  background: rgba(255,255,255,0.20);

  z-index: 1;

}


/* GREEN */

.green-window {

  position: absolute;

  left: 0;

  width: 100%;

  background: #00d965;

  box-shadow:
    0 0 14px rgba(0,255,115,0.7);

  z-index: 2;

}


/* MARCADOR */

.marker {

  position: absolute;

  left: 65px;

  width: 80px;
  height: 4px;

  background: white;

  box-shadow:
    0 0 10px white;

  display: none;

  transform: translateY(-50%);

  z-index: 20;

  pointer-events: none;

}

.marker::before {

  content: "";

  position: absolute;

  left: -9px;
  top: 50%;

  transform: translateY(-50%);

  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 9px solid white;

}


/* ========================================
   ESCALA
======================================== */

.scale-label {

  position: absolute;

  left: 140px;

  font-size: 13px;

  transform: translateY(-50%);

}

.label-max {

  top: 0%;
  color: #777;

}

.label-green-end {

  color: #00ff73;

}

.label-green-start {

  color: #00ff73;

}

.label-zero {

  top: 100%;
  color: #777;

}


/* ========================================
   ZONAS
======================================== */

.zone-label {

  position: absolute;

  right: 135px;

  font-size: 12px;
  font-weight: bold;

  transform: translateY(-50%);

}

.late-label {
  color: #ff3535;
}

.green-label {
  color: #00ff73;
}

.early-label {
  color: #ffae00;
}


/* ========================================
   TIMER
======================================== */

.timer-container {
  margin-top: 22px;
}

.timer {
  font-size: 68px;
  font-weight: 900;
}

.ms {
  font-size: 22px;
  color: #999;
}


/* ========================================
   BOTÃO X
======================================== */

.button-x {

  width: 110px;
  height: 110px;

  border-radius: 50%;

  margin: 18px auto 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #1266d3;

  border: 3px solid #2780f0;

  box-shadow:
    0 0 18px rgba(18,102,211,0.35);

  font-size: 52px;
  font-weight: bold;

  cursor: pointer;

  touch-action: none;

  transition:
    transform 0.05s,
    box-shadow 0.05s;

}

.button-x.pressed {

  transform: scale(0.86);

  box-shadow:
    0 0 35px rgba(18,102,211,0.9);

}

.touch-help {

  font-size: 13px;

  color: #777;

  margin-bottom: 10px;

}


/* ========================================
   RESULTADO
======================================== */

.result {

  font-size: 38px;
  font-weight: 900;

  margin-top: 12px;

  min-height: 48px;

}

.early {
  color: #ffae00;
}

.green {
  color: #00ff73;
}

.late {
  color: #ff3535;
}

.release-info {

  margin-top: 6px;

  font-size: 17px;

  color: #aaa;

  min-height: 24px;

}

.window-info {

  margin-top: 12px;

  color: #777;

  font-size: 14px;

}


/* ========================================
   CELULAR
======================================== */

@media (max-width: 600px) {

  body {
    align-items: flex-start;
  }

  .trainer {
    padding-top: 15px;
  }

  h1 {
    font-size: 22px;
  }

  .status {
    font-size: 12px;
    margin-bottom: 12px;
  }

  .window-settings {
    margin-bottom: 20px;
  }

  .vertical-wrapper {
    height: 280px;
  }

  .timing-bar {
    height: 280px;
  }

  .timer {
    font-size: 55px;
  }

  .button-x {

    width: 105px;
    height: 105px;

    font-size: 48px;

  }

  .result {
    font-size: 32px;
  }

}

</style>
</head>


<body>

<div class="trainer">


<h1>
JUMPSHOT TIMING TRAINER
</h1>


<div
id="status"
class="status">

🎮 Controle ou 📱 toque no X

</div>


<!-- =================================
     CONFIGURAÇÃO
================================= -->

<div class="window-settings">


<div class="settings-title">

CONFIGURE SUA GREEN WINDOW

</div>


<div class="settings-fields">


<div class="field">

<label for="greenStartInput">

INÍCIO DO GREEN (ms)

</label>

<input
id="greenStartInput"
type="number"
inputmode="numeric"
min="0"
value="605">

</div>


<div class="field">

<label for="greenEndInput">

FIM DO GREEN (ms)

</label>

<input
id="greenEndInput"
type="number"
inputmode="numeric"
min="1"
value="640">

</div>


</div>


<button
id="applyWindow"
class="apply-button"
type="button">

APLICAR JANELA

</button>


<!-- NOVO BOTÃO -->

<button
id="hideBarButton"
class="hide-button"
type="button">

👁 OCULTAR BARRA

</button>


<div
id="settingsMessage"
class="settings-message">

Janela atual: 605–640 ms

</div>


</div>


<!-- =================================
     BARRA
================================= -->

<div
id="timingArea"
class="timing-area">


<div class="timing-title">

RELEASE TIMING

</div>


<div class="vertical-wrapper">


<div
id="lateLabel"
class="zone-label late-label">

LATE

</div>


<div
id="greenLabel"
class="zone-label green-label">

GREEN

</div>


<div
id="earlyLabel"
class="zone-label early-label">

EARLY

</div>


<div class="timing-bar">


<div
id="liveFill"
class="live-fill">
</div>


<div
id="greenWindow"
class="green-window">
</div>


</div>


<div
id="marker"
class="marker">
</div>


<div
id="maxLabel"
class="scale-label label-max">

750 ms

</div>


<div
id="greenEndLabel"
class="scale-label label-green-end">

640

</div>


<div
id="greenStartLabel"
class="scale-label label-green-start">

605

</div>


<div
class="scale-label label-zero">

0 ms

</div>


</div>

</div>


<!-- =================================
     TIMER
================================= -->

<div class="timer-container">


<span
id="timer"
class="timer">

0

</span>


<span class="ms">

ms

</span>


</div>


<!-- =================================
     BOTÃO X
================================= -->

<div
id="buttonX"
class="button-x">

X

</div>


<div class="touch-help">

Segure e solte • Controle, mouse ou toque

</div>


<!-- =================================
     RESULTADO
================================= -->

<div
id="result"
class="result">

SEGURE X E SOLTE

</div>


<div
id="releaseInfo"
class="release-info">
</div>


<div
id="windowInfo"
class="window-info">

GREEN WINDOW: 605–640 ms

</div>


</div>


<script>

/* ========================================
   CONFIGURAÇÃO
======================================== */

let GREEN_START = 605;

let GREEN_END = 640;

const BAR_MIN = 0;

let BAR_MAX = 750;


/* ========================================
   ESTADO
======================================== */

let pressing = false;

let startTime = 0;

let inputSource = null;

let gamepadWasPressed = false;

let barHidden = false;


/* ========================================
   ELEMENTOS
======================================== */

const timer =
document.getElementById("timer");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const buttonX =
document.getElementById("buttonX");

const marker =
document.getElementById("marker");

const liveFill =
document.getElementById("liveFill");

const releaseInfo =
document.getElementById("releaseInfo");

const greenWindow =
document.getElementById("greenWindow");

const greenStartInput =
document.getElementById("greenStartInput");

const greenEndInput =
document.getElementById("greenEndInput");

const applyWindow =
document.getElementById("applyWindow");

const settingsMessage =
document.getElementById("settingsMessage");

const windowInfo =
document.getElementById("windowInfo");

const maxLabel =
document.getElementById("maxLabel");

const greenStartLabel =
document.getElementById("greenStartLabel");

const greenEndLabel =
document.getElementById("greenEndLabel");

const earlyLabel =
document.getElementById("earlyLabel");

const greenLabel =
document.getElementById("greenLabel");

const lateLabel =
document.getElementById("lateLabel");

const timingArea =
document.getElementById("timingArea");

const hideBarButton =
document.getElementById("hideBarButton");


/* ========================================
   OCULTAR / MOSTRAR BARRA
======================================== */

hideBarButton.addEventListener(
"click",
function() {

barHidden = !barHidden;


if (barHidden) {

timingArea.classList.add(
"hidden"
);

hideBarButton.classList.add(
"active"
);

hideBarButton.innerText =
"👁 MOSTRAR BARRA";

}

else {

timingArea.classList.remove(
"hidden"
);

hideBarButton.classList.remove(
"active"
);

hideBarButton.innerText =
"👁 OCULTAR BARRA";

}

}
);


/* ========================================
   POSIÇÃO
======================================== */

function getPosition(ms) {

let percentage =
100 -
(
(ms - BAR_MIN) /
(BAR_MAX - BAR_MIN)
) * 100;

if (percentage < 0)
percentage = 0;

if (percentage > 100)
percentage = 100;

return percentage;

}


/* ========================================
   DESENHAR GREEN WINDOW
======================================== */

function updateGreenWindow() {

const endPosition =
getPosition(GREEN_END);

const startPosition =
getPosition(GREEN_START);

const windowHeight =
startPosition - endPosition;


greenWindow.style.top =
endPosition + "%";

greenWindow.style.height =
windowHeight + "%";


greenEndLabel.style.top =
endPosition + "%";

greenEndLabel.innerText =
GREEN_END;


greenStartLabel.style.top =
startPosition + "%";

greenStartLabel.innerText =
GREEN_START;


maxLabel.innerText =
BAR_MAX + " ms";


const greenCenter =
(endPosition + startPosition) / 2;


greenLabel.style.top =
greenCenter + "%";


lateLabel.style.top =
(endPosition / 2) + "%";


earlyLabel.style.top =
(
startPosition +
(100 - startPosition) / 2
) + "%";


windowInfo.innerText =
"GREEN WINDOW: " +
GREEN_START +
"–" +
GREEN_END +
" ms";


settingsMessage.innerText =
"Janela atual: " +
GREEN_START +
"–" +
GREEN_END +
" ms";

}


/* ========================================
   ESCALA AUTOMÁTICA
======================================== */

function calculateBarMax() {

if (GREEN_END <= 700) {

BAR_MAX = 750;

return;

}


const desiredMax =
GREEN_END + 100;


BAR_MAX =
Math.ceil(
desiredMax / 50
) * 50;

}


/* ========================================
   APLICAR JANELA
======================================== */

function applyNewWindow() {

const newStart =
Number(
greenStartInput.value
);

const newEnd =
Number(
greenEndInput.value
);


if (
!Number.isFinite(newStart) ||
!Number.isFinite(newEnd)
) {

settingsMessage.innerText =
"Digite valores válidos.";

return;

}


if (
newStart < 0 ||
newEnd <= 0
) {

settingsMessage.innerText =
"Os valores precisam ser positivos.";

return;

}


if (newStart >= newEnd) {

settingsMessage.innerText =
"O início precisa ser menor que o fim.";

return;

}


if (newEnd > 3000) {

settingsMessage.innerText =
"Use uma janela abaixo de 3000 ms.";

return;

}


GREEN_START =
Math.round(newStart);

GREEN_END =
Math.round(newEnd);


calculateBarMax();

updateGreenWindow();


timer.innerText =
"0";

result.className =
"result";

result.innerText =
"SEGURE X E SOLTE";

releaseInfo.innerText =
"";

marker.style.display =
"none";

liveFill.style.height =
"0%";

}


applyWindow.addEventListener(
"click",
applyNewWindow
);


greenStartInput.addEventListener(
"keydown",
function(event) {

if (event.key === "Enter") {

applyNewWindow();

}

}
);


greenEndInput.addEventListener(
"keydown",
function(event) {

if (event.key === "Enter") {

applyNewWindow();

}

}
);


/* ========================================
   MARCADOR
======================================== */

function moveMarker(ms) {

const position =
getPosition(ms);

marker.style.top =
position + "%";

marker.style.display =
"block";

}


/* ========================================
   PREENCHIMENTO
======================================== */

function updateFill(ms) {

let fill =
(
(ms - BAR_MIN) /
(BAR_MAX - BAR_MIN)
) * 100;

if (fill < 0)
fill = 0;

if (fill > 100)
fill = 100;

liveFill.style.height =
fill + "%";

}


/* ========================================
   COMEÇAR
======================================== */

function startShot(source) {

if (pressing)
return;


const activeElement =
document.activeElement;


if (
activeElement === greenStartInput ||
activeElement === greenEndInput
) {

activeElement.blur();

}


pressing = true;

inputSource =
source;

startTime =
performance.now();


timer.innerText =
"0";


buttonX.classList.add(
"pressed"
);


result.className =
"result";

result.innerText =
"SEGURANDO...";


releaseInfo.innerText =
"";


marker.style.display =
"block";


moveMarker(0);


liveFill.style.height =
"0%";

}


/* ========================================
   FINALIZAR
======================================== */

function endShot(source) {

if (!pressing)
return;

if (inputSource !== source)
return;


const duration =
performance.now() -
startTime;


const ms =
Math.round(duration);


pressing =
false;

inputSource =
null;


timer.innerText =
ms;


moveMarker(ms);

updateFill(ms);


buttonX.classList.remove(
"pressed"
);


/* EARLY */

if (ms < GREEN_START) {

result.className =
"result early";

result.innerText =
"EARLY";


const difference =
GREEN_START - ms;


releaseInfo.innerText =
difference +
" ms antes da janela";

}


/* GREEN */

else if (ms <= GREEN_END) {

result.className =
"result green";

result.innerText =
"GREEN!";


const center =
(GREEN_START + GREEN_END) / 2;


const difference =
Math.round(
Math.abs(
ms - center
)
);


releaseInfo.innerText =
"Dentro da janela • " +
difference +
" ms do centro";

}


/* LATE */

else {

result.className =
"result late";

result.innerText =
"LATE";


const difference =
ms - GREEN_END;


releaseInfo.innerText =
difference +
" ms depois da janela";

}

}


/* ========================================
   CELULAR + MOUSE
======================================== */

buttonX.addEventListener(
"pointerdown",
function(event) {

event.preventDefault();


try {

buttonX.setPointerCapture(
event.pointerId
);

}

catch (error) {}


startShot(
"screen"
);

}
);


buttonX.addEventListener(
"pointerup",
function(event) {

event.preventDefault();

endShot(
"screen"
);

}
);


buttonX.addEventListener(
"pointercancel",
function(event) {

event.preventDefault();

endShot(
"screen"
);

}
);


buttonX.addEventListener(
"contextmenu",
function(event) {

event.preventDefault();

}
);


/* ========================================
   CONTROLE
======================================== */

function checkGamepad() {

const gamepads =
navigator.getGamepads();


let controller =
null;


for (
let i = 0;
i < gamepads.length;
i++
) {

if (gamepads[i]) {

controller =
gamepads[i];

break;

}

}


if (controller) {

status.innerText =
"🎮 " +
controller.id;


const xPressed =
controller.buttons[2].pressed;


if (
xPressed &&
!gamepadWasPressed
) {

startShot(
"gamepad"
);

}


if (
!xPressed &&
gamepadWasPressed
) {

endShot(
"gamepad"
);

}


gamepadWasPressed =
xPressed;

}

else {

status.innerText =
"📱 Toque no X • 🖱️ Mouse • 🎮 Controle";

gamepadWasPressed =
false;

}

}


/* ========================================
   LOOP
======================================== */

function update() {

checkGamepad();


if (pressing) {

const current =
performance.now() -
startTime;


const ms =
Math.round(current);


timer.innerText =
ms;


moveMarker(ms);

updateFill(ms);

}


requestAnimationFrame(
update
);

}


/* ========================================
   INICIAR
======================================== */

calculateBarMax();

updateGreenWindow();

update();

</script>

</body>
</html>
