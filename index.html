<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUBURBANO 2K | Ranking</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .ranking-page {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #000;
    }

    .ranking-page img {
      display: block;
      width: 100%;
      max-width: 1536px;
      height: auto;
    }

    @media (max-width: 700px) {
      .ranking-page img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <main class="ranking-page">
    <img
      src="suburbano-layout.png"
      alt="Ranking SUBURBANO 2K"
    >
  </main>

</body>
</html>
