<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUBURBANO 2K | Ranking</title>
<style>
:root{--gold:#ffb51b;--white:#f5f5f5;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,Helvetica,sans-serif;color:white}
body{display:flex;justify-content:center}
.page{
 position:relative;width:100%;max-width:520px;height:100dvh;min-height:620px;overflow:hidden;
 background:url("suburbano-mobile.png") center top/cover no-repeat;background-color:#080808;
}
.ranking-shell{
 position:absolute;left:19%;right:19%;top:30%;bottom:7.5%;
 display:flex;flex-direction:column;min-height:0;
}
.ranking-title{
 flex:none;height:46px;display:grid;grid-template-columns:45px 1fr 86px;align-items:center;
 padding:0 11px;background:linear-gradient(#ffc63f,#e9a00f);color:#090909;
 border:1px solid #ffd05a;font-weight:1000;font-style:italic;font-size:13px;
}
.ranking-title div:last-child{text-align:right}
.players-scroll{
 flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:rgba(7,7,7,.96);
 border:1px solid #454545;border-top:0;scrollbar-width:thin;scrollbar-color:#777 #151515;
 -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.player-row{
 min-height:47px;display:grid;grid-template-columns:45px 1fr 86px;align-items:center;
 padding:0 11px;border-bottom:1px solid #303030;background:linear-gradient(90deg,#151515,#080808);
}
.player-row:nth-child(even){background:linear-gradient(90deg,#101010,#060606)}
.rank{font-size:19px;font-weight:1000;font-style:italic;color:#ddd}
.name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{text-align:right;font-size:13px;font-weight:1000;color:var(--gold);white-space:nowrap}
.top1{background:linear-gradient(90deg,#2d2008,#080808);border-top:1px solid #d99a13;border-bottom:1px solid #d99a13}
.top1 .rank{color:#ffc43a} .top2 .rank{color:#eee} .top3 .rank{color:#bd7139}
.statusbar{position:absolute;left:20%;right:20%;bottom:3.7%;text-align:center;font-size:9px;color:#bbb}
.statusbar strong{color:var(--gold)}
@media(max-width:420px){
 .ranking-shell{left:18%;right:18%}
 .ranking-title,.player-row{grid-template-columns:38px 1fr 72px;padding:0 8px}
 .ranking-title{height:42px;font-size:11px}
 .player-row{min-height:44px}
 .rank{font-size:17px} .name,.xp{font-size:11px}
}
</style>
</head>
<body>
<main class="page">
 <section class="ranking-shell">
  <header class="ranking-title"><div>#</div><div>PLAYER</div><div>XP</div></header>
