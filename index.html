<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUBURBANO 2K | Ranking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif;color:#fff}
body{display:flex;justify-content:center}
.page{
  position:relative;width:100%;max-width:520px;height:100dvh;min-height:620px;overflow:hidden;
  background:url('suburbano-mobile.png') center top/cover no-repeat #080808;
}
.shell{
  position:absolute;left:18%;right:18%;top:30%;bottom:7.5%;
  display:flex;flex-direction:column;min-height:0;
}
.head,.row{
  display:grid;grid-template-columns:42px 1fr 82px;align-items:center;padding:0 9px;
}
.head{
  height:44px;flex:none;background:linear-gradient(#ffc63f,#e9a00f);color:#090909;
  border:1px solid #ffd05a;font-weight:1000;font-style:italic;font-size:12px;
}
.head div:last-child,.xp{text-align:right}
.list{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:rgba(7,7,7,.96);
  border:1px solid #454545;border-top:0;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#777 #151515;
}
.row{
  min-height:45px;border-bottom:1px solid #303030;
  background:linear-gradient(90deg,#151515,#080808);
}
.row:nth-child(even){background:linear-gradient(90deg,#101010,#060606)}
.rank{font-size:18px;font-weight:1000;font-style:italic;color:#ddd}
.name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{font-size:12px;font-weight:1000;color:#ffb51b;white-space:nowrap}
.first{
  background:linear-gradient(90deg,#2d2008,#080808);
  border-top:1px solid #d99a13;border-bottom:1px solid #d99a13
}
.first .rank{color:#ffc43a}
.third .rank{color:#bd7139}
.updated{
  position:absolute;left:18%;right:18%;bottom:3.7%;text-align:center;font-size:9px;color:#bbb
}
.updated b{color:#ffb51b}
</style>
</head>
